[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colibri-ai-studio"
version = "1.0.0"
description = "Colibri AI Studio — Intelligent Local AI Workstation for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Colibri AI Studio Engineering"}
]
dependencies = [
    "PyQt6>=6.7.0",
    "psutil>=6.0.0",
    "nvidia-ml-py>=12.535.0",
    "httpx>=0.27.0",
    "huggingface_hub>=0.25.0",
    "pydantic>=2.9.0",
    "markdown-it-py>=3.0.0",
    "Pygments>=2.18.0",
    "keyring>=25.4.0",
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-v --tb=short"
pythonpath = ["."]
